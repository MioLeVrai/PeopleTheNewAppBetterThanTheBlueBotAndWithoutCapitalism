<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mise à jour People</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #100e1a;
      color: #f2eff8;
    }

    body {
      display: grid;
      place-items: center;
      padding: 22px;
      user-select: none;
    }

    .card {
      position: relative;
      width: 100%;
      min-height: 282px;
      border: 1px solid #332b47;
      border-radius: 18px;
      background:
        linear-gradient(145deg, #181524, #110f1a);
      box-shadow: 0 22px 64px rgba(0,0,0,.52);
      padding: 30px 30px 24px;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 190px;
      height: 190px;
      right: -70px;
      top: -80px;
      border-radius: 50%;
      background: rgba(119, 103, 180, .16);
      filter: blur(14px);
      pointer-events: none;
    }

    .close {
      position: absolute;
      z-index: 2;
      right: 16px;
      top: 14px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #aea7bc;
      font-size: 22px;
      cursor: pointer;
    }

    .close:hover {
      background: #2b253f;
      color: white;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #8f82b6;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.15;
    }

    .message {
      max-width: 400px;
      margin: 14px 0 0;
      color: #b9b2c4;
      font-size: 14px;
      line-height: 1.55;
    }

    .versions {
      margin-top: 15px;
      color: #88818f;
      font-size: 12px;
    }

    .progress-wrap {
      display: none;
      margin-top: 18px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 7px;
      color: #aaa3b3;
      font-size: 12px;
    }

    .progress {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #252030;
    }

    .progress > div {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #67589d, #8a79ca);
      transition: width .16s ease;
    }

    .error {
      display: none;
      margin-top: 13px;
      color: #ff9296;
      font-size: 12px;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
    }

    button.action {
      min-width: 112px;
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-weight: 750;
      cursor: pointer;
    }

    button.secondary {
      background: #2b2632;
      color: #d6d0dc;
    }

    button.secondary:hover {
      background: #383141;
    }

    button.primary {
      min-width: 140px;
      background: #67589d;
    }

    button.primary:hover {
      background: #7767b4;
    }

    button:disabled {
      opacity: .62;
      cursor: default;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="glow"></div>
    <button id="closeButton" class="close" aria-label="Fermer">×</button>

    <p class="eyebrow">People Desktop</p>
    <h1>Mise à jour disponible</h1>

    <p id="message" class="message">
      Une nouvelle version de People est disponible.
    </p>

    <div id="versions" class="versions"></div>

    <div id="progressWrap" class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">Préparation…</span>
        <span id="progressPercent"></span>
      </div>
      <div class="progress">
        <div id="progressBar"></div>
      </div>
    </div>

    <div id="error" class="error"></div>

    <div class="actions">
      <button id="laterButton" class="action secondary">Plus tard</button>
      <button id="updateButton" class="action primary">Mettre à jour</button>
    </div>
  </main>

  <script src="update-window.js"></script>
</body>
</html>
